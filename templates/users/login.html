{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-md-5">
            <h2 class="text-center text-warning text-glow mb-4 fw-bold">ВХІД У ВУЛИК</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-light">Логін</label>
                    <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="Введіть логін" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-light">Пароль</label>
                    <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="Введіть пароль" required>
                </div>
                <button type="submit" class="btn-3d w-100">Увійти</button>
            </form>
            <p class="text-center text-muted mt-4">Ще немає акаунта? <a href="{% url 'users:register' %}" class="text-warning">Зареєструватися</a></p>
        </div>
    </div>
</div>
{% endblock %}
