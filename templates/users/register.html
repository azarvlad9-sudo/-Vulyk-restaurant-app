{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-md-5">
            <h2 class="text-center text-warning text-glow mb-4 fw-bold">РЕЄСТРАЦІЯ</h2>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label text-light">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn-3d w-100 mt-3">Зареєструватися</button>
            </form>
            <p class="text-center text-muted mt-4">Вже є акаунт? <a href="{% url 'login' %}" class="text-warning">Увійти</a></p>
        </div>
    </div>
</div>
{% endblock %}
