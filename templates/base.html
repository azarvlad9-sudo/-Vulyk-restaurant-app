<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресторан Вулик</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* 3D Скло-картки з ефектом підняття та підсвічування при наведенні */
        .glass-card {
            background: rgba(25, 25, 25, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 193, 7, 0.25);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), border-color 0.4s;
        }
        .glass-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(255, 193, 7, 0.8);
            box-shadow: 0 20px 40px rgba(255, 193, 7, 0.2), 0 0 20px rgba(255, 193, 7, 0.15);
        }

        /* 3D Анімація для картинок страв */
        .dish-img-wrapper {
            overflow: hidden;
            border-radius: 15px;
            position: relative;
        }
        .dish-img-wrapper img {
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .glass-card:hover .dish-img-wrapper img {
            transform: scale(1.1) rotate(1deg);
        }

        /* 3D Кнопки з глибоким ефектом натискання та світінням */
        .btn-3d {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            padding: 10px 25px;
            box-shadow: 0 5px 0 #b36b00, 0 8px 20px rgba(255, 152, 0, 0.4);
            transition: all 0.2s ease;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-3d:hover {
            background: linear-gradient(135deg, #ffca2c, #ffb300);
            box-shadow: 0 7px 0 #b36b00, 0 10px 25px rgba(255, 193, 7, 0.6);
            transform: translateY(-2px);
            color: #000;
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b36b00, 0 3px 10px rgba(0,0,0,0.4);
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(255, 193, 7, 0.6);
        }

        /* Стильний перемикач мов */
        .lang-switch {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 193, 7, 0.4);
            border-radius: 30px;
            padding: 3px;
            display: inline-flex;
            gap: 2px;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: #ffc107;
            color: #000;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.7);
        }
    </style>
</head>
<body>

    <!-- Навігаційна панель -->
    <div class="container my-4">
        <nav class="glass-card px-4 py-3 d-flex flex-wrap align-items-center justify-content-between gap-3">

            <!-- Логотип та перемикач мов -->
            <div class="d-flex align-items-center gap-3">
                <a href="{% url 'menu:home' %}" class="d-flex align-items-center text-decoration-none">
                    <span class="fs-3 me-2">🐝</span>
                    <span class="fs-4 fw-bold text-warning text-glow" data-i18n="logo">ВУЛИК</span>
                </a>

                <div class="lang-switch">
                    <button class="lang-btn active" id="langUa" onclick="setLanguage('ua')">UA</button>
                    <button class="lang-btn" id="langEn" onclick="setLanguage('en')">EN</button>
                </div>
            </div>

            <!-- Меню навігації -->
            <div class="d-flex align-items-center flex-wrap gap-2">
                <a href="{% url 'menu:home' %}" class="btn btn-outline-warning rounded-pill px-4" data-i18n="nav_home">Головна</a>
                <a href="{% url 'menu:menu_list' %}" class="btn btn-outline-warning rounded-pill px-4" data-i18n="nav_menu">Меню</a>
                <a href="#" class="btn btn-outline-warning rounded-pill px-4" data-i18n="nav_login">Вхід</a>
                <a href="#" class="btn btn-warning rounded-pill px-4 text-dark fw-bold" data-i18n="nav_register">Реєстрація</a>
                <a href="{% url 'cart:cart_detail' %}" class="btn-3d text-decoration-none ms-2">
                    <i class="fa-solid fa-cart-shopping me-1"></i> <span data-i18n="nav_cart">кошик</span>
                </a>
            </div>

        </nav>
    </div>

    <!-- Основний контент сторінки -->
    <div class="container mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        const translations = {
            ua: {
                logo: "ВУЛИК",
                nav_home: "Головна",
                nav_menu: "Меню",
                nav_login: "Вхід",
                nav_register: "Реєстрація",
                nav_cart: "кошик",
                hero_title: "СМАК, ЩО НАДИХАЄ",
                hero_desc: 'Преміальна кухня ресторану "Вулик" з миттєвою доставкою до вашого столу.',
                hero_btn: "Переглянути меню",
                popular_title: "Популярні страви",
                to_cart: "в кошик",
                menu_title: "НАШЕ МЕНЮ",
                menu_desc: "Обирайте найсмачніші страви для будь-якого приводу",
                all_dishes: "Усі страви",
                no_dishes: "Страви скоро з'являться в меню!",
                no_dishes_cat: "У цій категорії поки немає страв.",
                ingredients_title: "Інгредієнти:"
            },
            en: {
                logo: "VULYK",
                nav_home: "Home",
                nav_menu: "Menu",
                nav_login: "Login",
                nav_register: "Register",
                nav_cart: "cart",
                hero_title: "TASTE THAT INSPIRES",
                hero_desc: 'Premium cuisine of the "Vulyk" restaurant with instant delivery to your table.',
                hero_btn: "View Menu",
                popular_title: "Popular Dishes",
                to_cart: "to cart",
                menu_title: "OUR MENU",
                menu_desc: "Choose the most delicious dishes for any occasion",
                all_dishes: "All Dishes",
                no_dishes: "Dishes will appear in the menu soon!",
                no_dishes_cat: "No dishes in this category yet.",
                ingredients_title: "Ingredients:"
            }
        };

        function setLanguage(lang) {
            localStorage.setItem('site_lang', lang);

            if (lang === 'en') {
                document.getElementById('langEn').classList.add('active');
                document.getElementById('langUa').classList.remove('active');
            } else {
                document.getElementById('langUa').classList.add('active');
                document.getElementById('langEn').classList.remove('active');
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('site_lang') || 'ua';
            setLanguage(savedLang);
        };
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
