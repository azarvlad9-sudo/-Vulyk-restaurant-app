{% extends 'base.html' %}

{% block title %}Головна - Ресторан "Вулик"{% endblock %}

{% block extra_css %}
<style>
    .hero-banner-3d {
        transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        transform-style: preserve-3d;
        cursor: pointer;
    }

    .hero-banner-3d:hover {
        box-shadow: 0 25px 50px rgba(251, 133, 0, 0.4), 0 0 30px rgba(255, 183, 3, 0.2);
        border-color: rgba(255, 183, 3, 0.8) !important;
    }

    .banner-title {
        transition: transform 0.3s ease, text-shadow 0.3s ease;
        transform: translateZ(30px);
    }

    .hero-banner-3d:hover .banner-title {
        transform: translateZ(50px) scale(1.05);
        text-shadow: 0 0 30px rgba(251, 133, 0, 0.8);
    }

    .banner-text {
        transform: translateZ(20px);
    }

    .banner-btn-wrapper {
        transform: translateZ(40px);
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="glass-card hero-banner-3d tilt-card p-5 my-5 text-center position-relative overflow-hidden">
        <h1 class="display-2 banner-title text-glow mb-4">СМАК, ЩО НАДИХАЄ</h1>
        <p class="fs-4 text-light opacity-75 banner-text mb-5 max-w-75 mx-auto">
            Преміальна традиційна кухня ресторану "Вулик" з миттєвою доставкою прямо до вашого столу.
        </p>
        <div class="banner-btn-wrapper">
            <a href="{% url 'menu:menu_list' %}" class="btn-3d text-decoration-none fs-5 py-3 px-5">
                <i class="fas fa-utensils me-2"></i>Переглянути меню
            </a>
        </div>
    </div>
</div>
{% endblock %}
